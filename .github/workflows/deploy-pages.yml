name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Endpoint
        run: npm run generate:endpoint

      - name: Lint
        run: npm run lint -- --no-warn-ignored

      - name: Test with Jest
        run: npm test

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Run Cypress in Chrome
        uses: cypress-io/github-action@c65adadc3c1689f2a5b1079b56a1eaf4a7c60e1c # v7
        with:
          browser: chrome
          install: false
          start: npm run preview
          wait-on: http://127.0.0.1:4173

      - name: Preserve Cypress failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-failure-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
